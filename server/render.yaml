services:
  - type: web
    name: snapload-api
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && yt-dlp -U
    startCommand: gunicorn main:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
