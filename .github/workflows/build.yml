name: Build SnapLoad APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # FIX: Use the committed gradlew wrapper directly instead of SDKMAN.
      # SDKMAN installation in CI is slow, fragile, and unreliable.
      # The gradlew wrapper is now committed to the repo (gradle/wrapper/).
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: snapload-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Run Unit Tests
        run: ./gradlew test --no-daemon
        continue-on-error: true
